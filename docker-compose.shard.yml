# Sharded KV: one shard controller (kvsrv), two 3-node replica groups, and
# an HTTP gateway. Group 1 owns every shard at first; join group 2 with
#   curl -X POST localhost:18081/admin/join -d '{"gid":2,"servers":["g2n0:9000","g2n1:9000","g2n2:9000"]}'
x-build: &build
  context: .
  dockerfile: Dockerfile

x-g1: &g1 "--peers=g1n0:9000,g1n1:9000,g1n2:9000"
x-g2: &g2 "--peers=g2n0:9000,g2n1:9000,g2n2:9000"

services:
  shardctrl:
    build: *build
    hostname: shardctrl
    entrypoint: ["/shardctrl"]
    command: ["--addr=:9100"]

  g1n0: { build: *build, hostname: g1n0, entrypoint: ["/shardnode"], command: ["--gid=1", "--id=0", *g1, "--data=/data"], volumes: [g1n0-data:/data] }
  g1n1: { build: *build, hostname: g1n1, entrypoint: ["/shardnode"], command: ["--gid=1", "--id=1", *g1, "--data=/data"], volumes: [g1n1-data:/data] }
  g1n2: { build: *build, hostname: g1n2, entrypoint: ["/shardnode"], command: ["--gid=1", "--id=2", *g1, "--data=/data"], volumes: [g1n2-data:/data] }

  g2n0: { build: *build, hostname: g2n0, entrypoint: ["/shardnode"], command: ["--gid=2", "--id=0", *g2, "--data=/data"], volumes: [g2n0-data:/data] }
  g2n1: { build: *build, hostname: g2n1, entrypoint: ["/shardnode"], command: ["--gid=2", "--id=1", *g2, "--data=/data"], volumes: [g2n1-data:/data] }
  g2n2: { build: *build, hostname: g2n2, entrypoint: ["/shardnode"], command: ["--gid=2", "--id=2", *g2, "--data=/data"], volumes: [g2n2-data:/data] }

  shardgateway:
    build: *build
    entrypoint: ["/shardgateway"]
    command: ["--addr=:8080", "--ctrl=shardctrl:9100", "--group1=g1n0:9000,g1n1:9000,g1n2:9000"]
    ports: ["18081:8080"]
    depends_on: [shardctrl, g1n0, g1n1, g1n2, g2n0, g2n1, g2n2]

volumes:
  g1n0-data:
  g1n1-data:
  g1n2-data:
  g2n0-data:
  g2n1-data:
  g2n2-data:
